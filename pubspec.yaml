name: am_tips
description: "amTips — Digital tipping platform for service workers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.5.0

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Secure Storage
  flutter_secure_storage: ^11.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # UI & UX
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  share_plus: ^13.3.0
  path_provider: ^2.1.4
  screenshot: ^3.0.0

  # Dependency Injection
  get_it: ^9.2.1

  # Internationalization & Formatting
  intl: ^0.20.3

  # Local Cache / Persistence
  shared_preferences: ^2.3.3

  # Connectivity
  connectivity_plus: ^7.3.1

  # Utils
  uuid: ^4.5.1
  logger: ^2.4.0
  dartz: ^0.10.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

  # Code generation
  build_runner: ^2.4.12
  freezed: ^3.2.5
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
